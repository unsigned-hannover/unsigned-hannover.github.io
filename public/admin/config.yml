backend:
  name: github
  repo: unsigned-hannover/unsigned-hannover.github.io
  branch: main
  base_url: https://unsigned-oauth.example.workers.dev # TODO: URL des OAuth-Workers eintragen (siehe /worker)

# Bilder/Uploads landen im Repo unter public/uploads, werden von Astro als statische Assets ausgeliefert.
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum & Uhrzeit, name: date, widget: datetime }
      - { label: Ende (optional), name: endDate, widget: datetime, required: false }
      - { label: Ort, name: location, widget: string }
      - { label: Poster (optional), name: poster, widget: image, required: false }
      - { label: Ticket-Link (optional), name: ticketUrl, widget: string, required: false }
      - { label: Beschreibung, name: description, widget: text, required: false }
      - { label: Ausblenden, name: hidden, widget: boolean, default: false, hint: "Aktiviert = Event erscheint nirgends auf der Website", required: false }

  # Sets werden nachts automatisch aus dem SoundCloud-RSS-Feed angelegt (scripts/sync-soundcloud.mjs).
  # Hier nur nachbearbeiten: Genres korrigieren, Beschreibung kürzen, einzelne Sets ausblenden.
  - name: radio
    label: Radio-Sets
    label_singular: Set
    folder: src/content/radio
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { label: Titel, name: title, widget: string }
      - { label: Datum, name: date, widget: datetime }
      - { label: SoundCloud-Link, name: soundcloudUrl, widget: string, hint: "Öffentlicher SoundCloud-Track-Link" }
      - label: Genres
        name: genres
        widget: select
        multiple: true
        required: false
        hint: "Wird beim Import aus Titel und Beschreibung geraten, bitte prüfen. Grundlage für spätere Genre-Seiten."
        options: [House, Deep House, Tech House, Minimal, Techno, Melodic Techno, Hard Techno, Trance, Disco, Electro, Breaks, Drum & Bass, Ambient]
      - { label: Cover, name: cover, widget: image, required: false }
      - { label: Dauer, name: duration, widget: string, required: false, hint: "z.B. 1:02:30" }
      - { label: Beschreibung, name: description, widget: text, required: false }
      - { label: Ausblenden, name: hidden, widget: boolean, default: false, required: false, hint: "Aktiviert = Set erscheint nirgends auf der Website" }
      - { label: SoundCloud-ID, name: soundcloudId, widget: hidden, required: false }

  - name: site
    label: Website-Einstellungen
    files:
      - name: stats
        label: Statistiken (Startseite)
        file: src/content/site/stats.json
        fields:
          - label: Statistiken
            name: stats
            widget: object
            fields:
              - { label: Anzahl Events, name: events, widget: number }
              - { label: Hörer:innen (Text, z.B. "5000+"), name: listeners, widget: string }
              - { label: Gäste (Text, z.B. "2500+"), name: guests, widget: string }
